<div data-panel="{&quot;type&quot;:&quot;PanelGroup&quot;}" class="profile_customization">
		<div class="profile_customization_header">Awards Showcase</div>
	<div class="profile_customization_block">
		<div class="awards_showcase">
			<div class="showcase_content_bg">
							<div class="showcase_slot showcase_award" data-tooltip-html="Fire">
					<img class="showcase_award_icon" src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/still/27.png?v=5" data-animate-on-hover-src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/animated/27.png?v=5">
					<span class="showcase_award_count">1</span>
				</div>
								<div class="showcase_slot showcase_award" data-tooltip-html="Helpful">
					<img class="showcase_award_icon" src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/still/26.png?v=5" data-animate-on-hover-src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/animated/26.png?v=5">
					<span class="showcase_award_count">1</span>
				</div>
								<div class="showcase_slot showcase_award" data-tooltip-html="Beautiful">
					<img class="showcase_award_icon" src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/still/25.png?v=5" data-animate-on-hover-src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/animated/25.png?v=5">
					<span class="showcase_award_count">1</span>
				</div>
								<div class="showcase_slot showcase_award" data-tooltip-html="Poetry">
					<img class="showcase_award_icon" src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/still/5.png?v=5" data-animate-on-hover-src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/animated/5.png?v=5">
					<span class="showcase_award_count">22</span>
				</div>
								<div class="showcase_slot showcase_award" data-tooltip-html="Jester">
					<img class="showcase_award_icon" src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/still/19.png?v=5" data-animate-on-hover-src="https://store.fastly.steamstatic.com/public/images/loyalty/reactions/animated/19.png?v=5">
					<span class="showcase_award_count">16</span>
				</div>
							</div>
			<div class="showcase_content_bg showcase_stats_row">
				<div class="showcase_stat"  data-tooltip-text="Awards that were given to this user's profile, user reviews, Workshop items, screenshots, etc." >
					<div class="value">71</div>
					<div class="label">Awards Received</div>
				</div>
				<div class="showcase_stat"  data-tooltip-text="Number of awards this user has given out to other users' profiles, user reviews, Workshop items, screenshots, etc." >
					<div class="value">1</div>
					<div class="label">Awards Given</div>
				</div>
				<div style="clear: inline-start;"></div>
			</div>
		</div>
		<div style="clear: both"></div>
	</div>
</div>
